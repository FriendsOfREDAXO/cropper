# Dependabot config reference
# https://help.github.com/en/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
    # vendor/ liegt im Repository und wird so ausgeliefert. Dependabot hebt nur
    # composer.json an, nicht vendor/. Composer-PRs daher nicht mergen, sondern
    # das Update von Hand nachziehen (siehe README, "PHP-Abhängigkeiten").
    -   package-ecosystem: composer
        directory: /
        versioning-strategy: increase
        schedule:
            interval: monthly
        open-pull-requests-limit: 15
